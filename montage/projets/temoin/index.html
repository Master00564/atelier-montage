<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #faf7f1; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #fond { position: absolute; inset: 0; background: #faf7f1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="fond"></div>
      <div id="un" data-composition-id="un" data-composition-src="compositions/un.html" data-start="0" data-duration="3"
           data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="deux" data-composition-id="deux" data-composition-src="compositions/deux.html" data-start="3" data-duration="3"
           data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="voix" class="clip" src="assets/voix.mp3" data-start="0" data-duration="6" data-track-index="2" data-volume="1"></audio>
      <audio id="whoosh" class="clip" src="assets/whoosh.wav" data-start="2.85" data-duration="0.42" data-track-index="3" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
